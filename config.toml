# 한필지 설정. 아직 정하지 않은 값은 「기본값」으로 두었고 여기만 바꾸면 됨

[db]
# 접속 문자열은 환경변수 HANPILJI_DSN이 있으면 그것을 씀(비밀번호는 파일에 쓰지 않음)
dsn = "postgresql://localhost/hanpilji"

[storage]
# 원본 보관 위치. raw/{사이트}/{받은 날}/ 아래에 지우지 않고 쌓음
raw_dir = "./raw"

[pilot]
# 기본값: 서울 강남구. 시범 구가 정해지면 바꿈(시군구 5자리)
sigungu = ["11680"]

[law]
# 법제처 Open API 사용자 ID(OC). 환경변수 LAW_OC가 우선. 없으면 공식 테스트 계정 test(운영 전 발급 필요)
oc = "test"
# 0단계에 받을 부동산 법령. 이름은 법제처 법령명과 정확히 같아야 함
names = [
  "국토의 계획 및 이용에 관한 법률",
  "국토의 계획 및 이용에 관한 법률 시행령",
  "국토의 계획 및 이용에 관한 법률 시행규칙",
  "건축법",
  "건축법 시행령",
  "주택법",
  "주택임대차보호법",
  "주택임대차보호법 시행령",
  "상가건물 임대차보호법",
  "민간임대주택에 관한 특별법",
  "민간임대주택에 관한 특별법 시행령",
  "부동산 거래신고 등에 관한 법률",
  "공인중개사법",
  "도시 및 주거환경정비법",
  "부동산 가격공시에 관한 법률",
  "집합건물의 소유 및 관리에 관한 법률",
  "공동주택관리법",
]

[rtms]
# 아파트 매매 · 전월세 실거래가. 인증키는 환경변수 DATA_GO_KR_KEY(파일에 쓰지 않음)
months = 36          # 이번 달부터 거꾸로 몇 개월
refetch_months = 3   # 신고 · 해제가 늦게 붙는 최근 몇 개월은 매번 다시 받음

[luinfo]
# 이 날수 안에 받은 조합은 다시 받지 않음(중단 뒤 이어 받기 · 하루 호출 한도 아끼기). --refresh면 전부 다시
refresh_days = 30
# 행위제한 API로 물어볼 건물 종류 이름. 용도지역은 core.dim_zone의 UQ 코드 16개
# 세부 이름으로 물어야 함(부분 일치). 「공동주택」 「근린생활시설」 「업무시설」 같은 시설군 이름은 결과가 없음(2026-10-27 실측)
acts = [
  "단독주택", "다중주택", "다가구주택", "아파트", "연립주택", "다세대주택", "기숙사",
  "소매점", "휴게음식점", "일반음식점", "제과점", "사무소", "금융업소", "의원", "학원", "독서실",
  "노래연습장", "세탁소", "미용원", "목욕장", "어린이집", "오피스텔", "상점", "일반숙박시설",
  "생활숙박시설", "병원", "학교", "노인복지시설", "체육관", "주차장", "주유소", "공장", "창고",
  "단란주점", "유흥주점", "장례식장",
]

[gpt]
# 부동산 GPT 엔진. 키는 환경변수 HANPILJI_LLM_API_KEY(파일에 쓰지 않음)
# 제공자 · 모델은 환경변수 HANPILJI_LLM_PROVIDER · HANPILJI_LLM_MODEL이 우선
provider = "anthropic"
model = "claude-opus-5-5"   # 비용을 줄이려면 claude-sonnet-5-5
effort = "medium"           # low · medium · high. 높을수록 꼼꼼하지만 느리고 비쌈
max_tokens = 16000
max_rounds = 6              # 질문 하나에 도구를 부르는 최대 횟수
fallbacks = "default"       # 모델이 거절하면 서버가 다른 모델로 다시 돌림. 끄려면 ""

[bld]
# 건축HUB 건축물대장. 단지 PNU마다 총괄표제부 · 표제부 · 지역지구 · 부속지번을 받음(필지 하나에 보통 4번 호출)
# 이 날수 안에 받은 필지는 다시 받지 않음(중단 뒤 이어 받기). --refresh면 전부 다시
refresh_days = 30
# 한 번 실행에 쓸 최대 호출 수. 비우면 하루 한도(개발계정 10,000)에 걸릴 때까지. --max-calls가 우선
# max_calls = 9000
