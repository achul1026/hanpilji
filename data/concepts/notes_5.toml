body = """표준주택가격: 국토교통부장관이 단독주택 중 대표 주택을 골라 한국부동산원에 조사 · 산정을 의뢰해 공시(1월 1일 기준).
개별주택가격: 시장 · 군수 · 구청장이 표준주택가격을 기준으로 주택가격비준표로 산정, 한국부동산원 검증을 거쳐 공시(4월 30일까지).
공동주택가격: 국토교통부장관이 한국부동산원에 조사 · 산정을 맡겨 공시(4월 30일까지). 이의신청은 공시일부터 30일 이내.
토지는 감정평가법인등이, 주택은 한국부동산원이 조사한다는 차이를 기억한다.
