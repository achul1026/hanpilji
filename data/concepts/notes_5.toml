# ── G14 부동산 개발 ──
[[note]]
id = "C058"
topic = "G14"
term = "개발 과정과 개발 위험"
summary = "개발은 구상 → 예비 타당성 → 부지 확보 → 타당성 분석 → 금융 → 건설 → 마케팅 순으로 진행되며 법률 · 시장 · 비용 위험이 따른다."
body = """법률적 위험: 인허가 지연 · 불허, 용도지역 · 규제 변경. 이미 인허가를 받은 땅을 사면 줄일 수 있다.
시장 위험: 분양 · 임대가 예상보다 안 됨. 시장 연구(흡수율 분석)로 줄인다.
비용 위험: 공사비 상승, 공기 지연. 최대가격보증계약(GMP) 등으로 줄인다.
워포드(Wofford)의 7단계: 구상 → 예비적 타당성 분석 → 부지 구입 → 타당성 분석 → 금융 → 건설 → 마케팅."""

[[note]]
id = "C059"
topic = "G14"
term = "타당성 분석 · 시장 분석 · 흡수율"
summary = "개발 사업이 법 · 물리 · 경제적으로 가능한지, 그리고 시장이 그 공급을 받아줄지를 따지는 과정이다."
body = """지역경제분석 → 시장분석(수요 · 공급) → 시장성분석(흡수율) → 타당성분석(수익성) → 투자분석 순으로 범위를 좁힌다.
흡수율 분석: 일정 기간 동안 시장에 공급된 물량이 얼마나 팔리거나 임대됐는지(소화율)를 보아 신규 사업의 분양 속도를 예측한다.
민감도(감응도) 분석: 임대료 · 공실률 · 건축비 · 금리 같은 변수가 바뀔 때 수익성이 얼마나 변하는지 본다.
시장성 분석은 개발된 부동산이 현재나 미래에 팔리거나 임대될 수 있는지 능력을 따진다."""
data = ["q_deal_list", "q_price_trend"]

[[note]]
id = "C060"
topic = "G14"
term = "민간 개발 방식(자체 · 지주공동 · 토지신탁 · 컨소시엄)"
summary = "토지 소유자와 개발업자가 위험과 이익을 어떻게 나누느냐에 따라 여러 개발 방식이 있다."
body = """자체 개발: 토지 소유자가 직접 개발. 이익이 크지만 위험도 모두 진다.
지주공동사업: 등가교환(토지 가치만큼 건물로 받음), 공사비 대물변제(공사비를 건물로 지급), 분양금 공사비 지급, 투자자 모집형, 사업수탁방식.
토지신탁: 신탁회사에 토지를 맡기고 신탁회사가 자금 조달 · 건설 · 분양을 맡는다(형식상 소유권이 신탁회사로 이전). 사업수탁방식과 달리 소유권이 넘어간다.
컨소시엄: 대규모 사업에 여러 회사가 함께 참여.
공공 개발 방식으로는 수용 · 환지 · 혼용 방식이 있다."""

[[note]]
id = "C061"
topic = "G14"
term = "민간투자 사업방식(BTO · BTL 등)"
summary = "민간이 사회기반시설을 짓고 소유권 이전 시점과 투자비 회수 방법(사용료 또는 정부 임대료)에 따라 방식이 나뉜다."
body = """BTO(Build-Transfer-Operate): 준공 후 소유권을 정부에 넘기고, 민간이 일정 기간 운영하며 이용료로 회수(도로 · 터널).
BTL(Build-Transfer-Lease): 준공 후 소유권을 넘기고, 정부에 시설을 임대해 정부가 내는 임대료로 회수(학교 · 기숙사).
BOT: 짓고 운영한 뒤 기간이 끝나면 소유권을 넘김. BOO: 짓고 소유권을 가진 채 계속 운영.
BLT: 짓고 정부에 임대하다 기간이 끝나면 소유권을 넘김.
글자 순서 = 진행 순서(B 건설, T 이전, O 운영, L 임대, O 소유)로 기억하면 쉽다."""

# ── G15 부동산 관리 · 마케팅 ──
[[note]]
id = "C062"
topic = "G15"
term = "부동산 관리 방식(자기 · 위탁 · 혼합)과 관리의 영역"
summary = "소유자가 직접 관리하는 자기관리, 전문업체에 맡기는 위탁관리, 둘을 섞은 혼합관리가 있다."
body = """자기관리(직접관리): 기밀 유지 · 신속한 대응 · 애정 있는 관리. 전문성이 낮고 업무가 소홀해질 수 있다. 소규모 단독주택에 맞다.
위탁관리(간접관리): 전문성 · 효율. 기밀 유출 · 관리 소홀(관리업체 신뢰 문제). 대형 건물 · 공동주택에 맞다.
혼합관리: 중요 업무는 직접, 기술 · 청소 같은 일부는 위탁. 책임 소재가 불분명해질 수 있다.
관리 영역: 시설관리(물리적 유지), 재산 · 임대관리(임대 · 수지), 자산관리(포트폴리오 · 매입매각 · 투자 리스크).
임대차 유형: 주거용은 조임대차(총임대료), 매장용은 비율임대차(매출 비례), 공업용은 순임대차."""

[[note]]
id = "C063"
topic = "G15"
term = "부동산 마케팅 전략(STP · 4P · AIDA)"
summary = "시장을 나누고(S) 목표를 정해(T) 자리매김(P)한 뒤, 제품 · 가격 · 유통 · 홍보(4P)를 섞어 쓰는 것이 시장점유 마케팅이고, 소비자의 마음 단계를 따라가는 것이 고객점유 마케팅이다."
body = """시장점유 마케팅(공급자 중심): STP(시장세분화 · 표적시장 선정 · 차별화 포지셔닝) + 4P 믹스(Product · Price · Place · Promotion).
고객점유 마케팅(소비자 중심): AIDA(주의 Attention → 관심 Interest → 욕망 Desire → 행동 Action) 단계별 메시지.
관계 마케팅: 공급자와 소비자의 장기적 관계 · 브랜드.
가격 전략: 시가 전략, 고가 전략(초기 고가), 저가 전략(빠른 분양), 신축가격 전략(위치 · 층별 다르게)."""

# ── G16 감정평가 3방식 ──
[[note]]
id = "C064"
topic = "G16"
term = "감정평가 3방식 6방법"
summary = "비용성(원가방식) · 시장성(비교방식) · 수익성(수익방식)의 세 방식으로, 가액과 임대료를 구하는 방법이 각각 있다."
body = """원가방식: 원가법(가액 → 적산가액), 적산법(임대료 → 적산임료).
비교방식: 거래사례비교법(가액 → 비준가액), 임대사례비교법(임대료 → 비준임료), 공시지가기준법(토지).
수익방식: 수익환원법(가액 → 수익가액), 수익분석법(임대료 → 수익임료).
대상물건에 맞는 주된 방법을 쓰고, 다른 방법으로 구한 시산가액과 비교해 합리성을 검토한다(시산가액 조정)."""
laws = ["감정평가에 관한 규칙 제11조", "감정평가에 관한 규칙 제12조"]

[[note]]
id = "C065"
topic = "G16"
term = "원가법과 감가수정"
summary = "기준시점의 재조달원가에서 감가수정을 빼서 가액을 구한다. 건물 감정평가의 주된 방법이다."
formula = "적산가액 = 재조달원가 - 감가수정액\n정액법 매년 감가액 = 재조달원가 × (1 - 잔가율) ÷ 경제적 내용연수"
body = """재조달원가: 기준시점에 대상을 다시 만드는 데 드는 비용. 복제원가(똑같이) 또는 대치원가(같은 효용).
감가 요인: 물리적(노후 · 손상), 기능적(설계 불량 · 설비 구식), 경제적(주변 환경과 부적합, 외부 요인).
감가수정 방법: 내용연수법(정액법 · 정률법 · 상환기금법), 관찰감가법, 분해법.
정액법은 매년 같은 금액, 정률법은 매년 같은 비율로 감가(초기 감가가 큼).
감가수정은 회계상 감가상각과 달리 시장성 · 기준시점 현재 상태를 반영한다."""
laws = ["감정평가에 관한 규칙 제15조"]
example = "재조달원가 1억, 경제적 내용연수 50년, 잔가율 10%, 경과 10년(정액법) → 연 감가 180만 원, 감가누계 1,800만 원, 적산가액 8,200만 원."

[[note]]
id = "C066"
topic = "G16"
term = "거래사례비교법"
summary = "비슷한 부동산의 거래사례 가격을 대상에 맞게 사정보정 · 시점수정 · 요인비교해 가액을 구한다."
formula = "비준가액 = 사례가격 × 사정보정치 × 시점수정치 × 지역요인 비교치 × 개별요인 비교치 × 면적 비교치"
body = """사례 선택 기준: 위치 유사성, 물적 유사성, 시점 수정 가능성, 사정 보정 가능성.
사정보정: 급매 · 특수관계 거래 같은 특수 사정을 정상화.
시점수정: 사례 시점부터 기준시점까지의 가격 변동을 반영(지가변동률 · 아파트 가격지수 등).
지역요인 · 개별요인 비교: 위치 · 층 · 향 · 면적 등 차이를 보정.
아파트 같은 구분소유건물, 토지와 건물을 일괄평가하는 경우의 주된 방법이다.
한필지의 실거래 목록과 가격지수는 사례 선택 · 시점수정 자료가 된다."""
laws = ["감정평가에 관한 규칙 제16조"]
data = ["q_deal_list", "q_complex_price", "q_market_series:apt_sale_idx"]
example = "사례 3억(정상 거래), 이후 가격지수 5% 상승, 대상이 사례보다 개별요인 3% 우세 → 3억 × 1.05 × 1.03 ≈ 3억 2,445만 원."

[[note]]
id = "C067"
topic = "G16"
term = "수익환원법(직접환원법 · 할인현금흐름분석법)과 환원율"
summary = "대상 부동산이 앞으로 낼 순수익을 환원율로 나누거나(직접환원), 기간별 현금흐름을 할인해(DCF) 가액을 구한다."
formula = "직접환원법: 수익가액 = 순영업소득 ÷ 환원율\n할인현금흐름분석법: 수익가액 = Σ 현금흐름_t/(1+할인율)^t + 복귀가액/(1+할인율)^n"
body = """환원율 구하는 방법: 시장추출법(비슷한 부동산의 순수익 ÷ 가격), 요소구성법(무위험률 + 위험할증률), 투자결합법(물리적: 토지 · 건물, 금융적: 저당 · 지분), 엘우드법, 부채감당법(환원율 = 부채감당률 × 대부비율 × 저당상수).
환원율이 오르면(금리 상승 · 위험 증가) 같은 순수익이라도 가액은 내려간다.
임대용 부동산 · 기업용 부동산의 주된 방법이다."""
laws = ["감정평가에 관한 규칙 제2조"]
example = "순영업소득 연 6,000만 원, 환원율 5% → 수익가액 12억 원. 환원율이 6%가 되면 10억 원."

[[note]]
id = "C068"
topic = "G16"
term = "공시지가기준법"
summary = "토지를 감정평가할 때 비슷한 표준지의 공시지가를 기준으로 시점수정 · 지역요인 · 개별요인 비교 · 그 밖의 요인 보정을 거쳐 가액을 구하는 방법이다."
formula = "토지가액 = 비교표준지 공시지가 × 시점수정(지가변동률) × 지역요인 × 개별요인 × 그 밖의 요인 보정"
body = """토지 감정평가의 원칙적인 방법이다(적정한 실거래가가 있으면 거래사례비교법 등으로 검토).
비교표준지는 용도지역 · 이용상황 · 주변환경이 같거나 비슷하고 가까운 표준지를 고른다.
시점수정은 국토교통부가 조사 · 발표하는 지가변동률을 원칙으로 한다.
그 밖의 요인 보정은 공시지가와 시장 가치 차이를 반영하는 단계다."""
laws = ["감정평가에 관한 규칙 제14조"]
data = ["q_land_price_trend"]

# ── G17 가격공시제도 ──
[[note]]
id = "C069"
topic = "G17"
term = "표준지공시지가와 개별공시지가"
summary = "국토교통부장관이 대표 토지(표준지)의 ㎡당 가격을 매년 공시하고, 시장 · 군수 · 구청장이 이를 기준으로 모든 필지의 개별공시지가를 정한다."
body = """표준지공시지가: 국토교통부장관이 매년 1월 1일 기준으로 조사 · 평가해 공시. 감정평가법인등에게 의뢰한다. 이의신청은 공시일부터 30일 이내 국토교통부장관에게.
효력: 토지시장 지가 정보 제공, 일반 토지 거래의 지표, 국가 · 지자체의 지가 산정과 감정평가의 기준.
개별공시지가: 시장 · 군수 · 구청장이 표준지공시지가를 기준으로 토지가격비준표를 써서 산정하고, 감정평가법인등의 검증을 거쳐 결정 · 공시(매년 5월 31일까지). 이의신청은 30일 이내 시장 · 군수 · 구청장에게.
개별공시지가는 재산세 · 양도세 · 상속세 등의 과세 기준, 부담금 산정에 쓰인다.
표준지 · 공시지가 · 개별지가 모두 한필지 토지 정보에서 연도별로 볼 수 있다."""
laws = ["부동산 가격공시에 관한 법률 제3조", "부동산 가격공시에 관한 법률 제7조", "부동산 가격공시에 관한 법률 제10조", "부동산 가격공시에 관한 법률 제11조"]
data = ["q_land_price_trend", "q_price_vs_official"]

[[note]]
id = "C070"
