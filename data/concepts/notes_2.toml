# ── G03 수요와 공급 ──
[[note]]
id = "C010"
topic = "G03"
term = "수요 · 수요량과 수요 결정요인"
summary = "수요량은 다른 조건이 같을 때 가격에 따라 사려는 양(곡선 위의 이동), 수요 변화는 가격 밖의 요인으로 곡선 자체가 움직이는 것이다."
body = """수요량의 변화: 그 부동산 가격이 바뀌어 수요곡선 위에서 점이 움직임.
수요의 변화(곡선 이동) 요인: 소득, 인구 · 가구 수, 대체재 · 보완재 가격, 금리(대출 이자), 대출 규제(LTV · DSR), 세금, 가격 상승 기대, 선호.
예: 금리가 오르면 이자 부담이 커져 매수 수요가 줄어 곡선이 왼쪽으로 이동한다. 가구 수가 늘면 오른쪽으로 이동한다.
유효수요는 살 의사와 지불 능력이 모두 있는 수요다."""
data = ["q_market_series:households", "q_market_series:population", "q_market_series:mortgage_rate"]

[[note]]
id = "C011"
topic = "G03"
term = "공급 · 공급 결정요인"
summary = "공급량은 가격에 따른 이동, 공급 변화는 건축비 · 금리 · 규제 · 기술 같은 가격 밖의 요인으로 곡선이 움직이는 것이다."
body = """공급의 변화 요인: 건축비(자재 · 인건비), 개발 금리, 토지 가격, 용적률 · 인허가 규제, 기술 발전, 미래 가격 기대.
건축비가 오르거나 금리가 오르면 공급곡선이 왼쪽으로 이동한다.
부동산은 착공부터 준공까지 시간이 걸려 공급이 늦게 반응한다(공급 시차)."""
data = ["q_market_series:base_rate"]

[[note]]
id = "C012"
topic = "G03"
term = "수요의 가격탄력성"
summary = "가격이 1% 변할 때 수요량이 몇 % 변하는지를 보는 값이다. 대체재가 많고 기간이 길수록 크다."
formula = "수요의 가격탄력성 = 수요량 변화율(%) ÷ 가격 변화율(%) (절댓값)"
body = """1보다 크면 탄력적, 1보다 작으면 비탄력적, 0이면 완전비탄력, 무한대면 완전탄력.
탄력적일 때 가격을 내리면 총수입(가격 × 수량)이 늘고, 비탄력적이면 가격을 올릴 때 총수입이 는다.
대체재가 많을수록(용도가 다양할수록), 측정 기간이 길수록, 용도를 좁게 정의할수록(예: 강남 아파트) 탄력성이 크다.
소득탄력성 = 수요량 변화율 ÷ 소득 변화율. 양수면 정상재, 음수면 열등재.
교차탄력성 = A 수요량 변화율 ÷ B 가격 변화율. 양수면 대체재, 음수면 보완재."""
example = "가격이 10% 오를 때 수요량이 5% 줄면 탄력성은 0.5(비탄력적)."

[[note]]
id = "C013"
topic = "G03"
term = "공급의 가격탄력성"
summary = "부동산 공급은 단기에 비탄력적이고 장기로 갈수록 탄력적이 된다."
formula = "공급의 가격탄력성 = 공급량 변화율(%) ÷ 가격 변화율(%)"
body = """단기에는 건물을 바로 지을 수 없어 공급이 거의 고정된다. 그래서 수요가 늘면 가격이 크게 오른다.
장기에는 신규 건설이 이뤄져 공급이 늘고 가격 상승 폭이 줄어든다.
공급이 비탄력적일수록 수요 변화가 가격에 더 크게, 거래량에는 작게 반영된다.
개발 규제가 강하거나 인허가 기간이 길수록 공급은 더 비탄력적이다."""

[[note]]
id = "C014"
topic = "G03"
term = "유량(flow)과 저량(stock)"
summary = "유량은 일정 기간 동안의 양(예: 연간 주택 공급량, 임대료 수입), 저량은 한 시점에 쌓여 있는 양(예: 주택 재고, 자산 가치)이다."
body = """유량 예: 연간 신규 주택 착공 · 준공 수, 월 거래량, 임대료 · 순영업소득, 가계 소득.
저량 예: 현재 주택 재고 수, 부동산 가격(자산 가치), 인구 · 가구 수(특정 시점), 가계 자산 · 부채 잔액.
주택시장은 저량(기존 재고) 시장이 크고 유량(신규 공급)은 재고의 일부에 그쳐 단기 공급이 비탄력적이다."""
data = ["q_deal_list", "q_market_series:households"]

# ── G04 가격 형성과 균형 ──
[[note]]
id = "C015"
topic = "G04"
term = "균형가격과 균형의 이동"
summary = "수요와 공급이 만나는 점에서 가격과 거래량이 정해지고, 어느 한쪽이 움직이면 새 균형으로 옮겨 간다."
body = """수요 증가 → 가격 상승 · 거래량 증가. 공급 증가 → 가격 하락 · 거래량 증가.
수요와 공급이 같이 늘면 거래량은 늘지만 가격은 둘 중 더 크게 변한 쪽을 따른다(문제에서 변화 폭 조건을 꼭 확인).
공급이 완전비탄력(수직)이면 수요가 늘어도 거래량은 그대로이고 가격만 오른다.
수요가 완전탄력(수평)이면 공급이 변해도 가격은 그대로이고 거래량만 바뀐다."""
data = ["q_price_trend", "q_market_series:apt_sale_idx"]

[[note]]
id = "C016"
topic = "G04"
term = "거미집 모형"
summary = "공급이 한 기 늦게 반응할 때 가격과 공급량이 번갈아 출렁이는 모습을 설명하는 모형이다."
body = """가정: 이번 공급량은 지난 기 가격을 보고 정해진다(공급 시차). 수요는 바로 반응한다.
수렴형: 수요의 가격탄력성 > 공급의 가격탄력성(기울기로는 수요곡선 기울기의 절댓값 < 공급곡선 기울기의 절댓값). 출렁임이 점점 줄어 균형으로 간다.
발산형: 수요의 탄력성 < 공급의 탄력성. 출렁임이 커진다.
순환형: 두 탄력성이 같다.
주택처럼 짓는 데 시간이 걸리는 시장, 특히 상업용 부동산의 공급 과잉 · 부족 주기를 설명할 때 쓴다."""
example = "수요곡선 P = 400 - 2Q, 공급곡선 P = 100 + 4Q 이면 기울기 절댓값이 수요 2 < 공급 4 이므로 수렴형."

[[note]]
id = "C017"
topic = "G04"
term = "가치와 가격"
summary = "가격은 실제로 거래된 금액(과거 · 사실), 가치는 장래 이익의 현재가치(현재 · 판단)이다. 단기에는 다를 수 있지만 장기에는 가까워진다."
body = """가격: 특정 거래에서 실제 지불된 금액. 거래 사정(급매, 특수관계)에 따라 가치와 어긋날 수 있다.
가치: 대상 부동산이 장래에 가져올 편익의 현재가치. 목적에 따라 여러 가치(시장가치, 투자가치, 보험가치 등)가 있다.
시장가치(감정평가 실무기준): 통상적인 시장에서 충분한 기간 공개된 후, 내용에 정통한 당사자 사이에 신중하고 자발적인 거래가 있을 때 성립될 가능성이 가장 높은 가액.
실거래가와 공시가격 · 감정가를 함께 보는 것도 가격과 가치의 차이를 보는 일이다."""
data = ["q_price_vs_official", "q_deal_list"]
laws = ["감정평가에 관한 규칙 제2조"]

[[note]]
id = "C018"
topic = "G04"
term = "가치발생요인"
summary = "부동산 가치는 효용, 상대적 희소성, 유효수요, 이전성이 함께 있을 때 생긴다."
body = """효용(유용성): 쓸모. 주거는 쾌적성, 상업은 수익성, 공업은 생산성.
상대적 희소성: 원하는 만큼 충분하지 않음(토지의 부증성과 연결).
유효수요: 살 의사와 지불 능력이 함께 있는 수요.
이전성: 법적으로 소유권 등을 넘길 수 있음(법률적 측면).
이 요인들에 영향을 주는 일반요인(사회 · 경제 · 행정), 지역요인, 개별요인을 가격형성요인이라 한다."""

[[note]]
id = "C019"
topic = "G04"
term = "최유효이용의 원칙"
summary = "부동산 가치는 합리적이고 합법적이며 물리적으로 가능하고 경제적으로 가장 높은 가치를 내는 이용을 전제로 정해진다."
body = """판단 기준 4가지: 법적 허용성(용도지역 · 건축 규제), 물리적 채택 가능성(모양 · 지반 · 접도), 합리적 이용(수요가 있음), 최고 수익성(가장 높은 가치).
부동산 가격 제원칙의 중심 원칙이다.
나지 상정 최유효이용과 현재 건물이 있는 상태의 최유효이용이 다르면, 철거 · 재건축 여부 판단이나 건부감가로 이어진다."""
data = ["q_zoning_check"]

[[note]]
id = "C020"
topic = "G04"
term = "부동산 가격 제원칙(변동 · 예측 · 대체 · 기여 · 균형 · 적합 · 경쟁)"
summary = "부동산 가격이 어떻게 형성 · 변하는지에 대한 원칙들로, 감정평가 판단의 근거가 된다."
body = """변동의 원칙: 가격형성요인이 늘 변하므로 가격도 변한다 → 기준시점 확정이 필요.
예측의 원칙: 가치는 장래 이익의 예상에 달려 있다 → 수익환원법의 근거.
대체의 원칙: 대체 가능한 부동산과 비교해 가격이 정해진다 → 거래사례비교법의 근거.
기여의 원칙: 부분이 전체 가치에 얼마나 보태는지로 그 부분의 가치를 본다 → 추가 투자 · 증축 판단.
균형의 원칙: 내부 구성요소(토지와 건물 등)가 균형을 이룰 때 가치가 최고 → 기능적 감가.
적합의 원칙: 주변 환경과 어울릴 때 가치가 최고 → 경제적 감가.
경쟁의 원칙: 초과이윤은 경쟁을 불러 결국 사라진다.
수익체증 · 체감의 원칙, 수요공급의 원칙, 외부성의 원칙도 함께 다룬다."""
laws = ["감정평가에 관한 규칙 제2조"]

# ── G05 부동산시장 ──
[[note]]
id = "C021"
topic = "G05"
term = "부동산시장의 특성"
summary = "부동산시장은 지역마다 나뉘고, 정보가 고르지 않으며, 거래가 드물고 비용이 큰 불완전경쟁시장이다."
body = """국지성: 부동성 때문에 지역별 하위시장으로 나뉜다.
거래의 비공개성 · 정보 비대칭: 거래 내용이 다 드러나지 않아 정보 탐색 비용이 크다(실거래가 공개제도가 이를 줄인다).
비표준화: 개별성 때문에 상품이 표준화되지 않는다.
거래 비용(세금 · 중개보수 · 등기비)이 크고, 자금 조달 의존이 높아 금리에 민감하다.
수급 조절이 느려 단기 가격 변동이 크다."""
data = ["q_deal_list", "q_complex_price"]

[[note]]
id = "C022"
topic = "G05"
term = "효율적 시장 가설(약성 · 준강성 · 강성)"
summary = "정보가 가격에 얼마나 빨리 반영되는지에 따라 시장을 세 가지로 나눈다."
body = """약성 효율적 시장: 과거 정보(가격 · 거래량)가 이미 반영됨 → 기술적 분석으로 초과이윤 불가, 현재 · 미래 정보로는 가능.
준강성 효율적 시장: 공표된 모든 정보(과거 + 현재 공개 정보)가 반영됨 → 기본적 분석으로도 초과이윤 불가, 미공개 정보로는 가능.
강성 효율적 시장: 공개 · 비공개 모든 정보가 반영됨 → 어떤 정보로도 초과이윤 불가(현실에선 거의 없음).
포함 관계: 강성 ⊂ 준강성 ⊂ 약성.
부동산시장은 정보 비대칭이 커서 대체로 약성 또는 준강성 수준으로 본다."""

[[note]]
id = "C023"
topic = "G05"
term = "할당 효율적 시장"
summary = "정보를 얻는 비용과 그 정보로 얻는 초과이윤이 같아져, 누구도 더 싸게 정보를 얻어 이득을 볼 수 없는 시장이다."
body = """불완전경쟁시장이라도 할당 효율적일 수 있다. 정보 비용 = 초과이윤 이면 할당 효율적이다.
정보 비용 < 초과이윤 이면 투기가 가능하다(할당 효율적이지 않음).
예: 개발 예정지 정보를 1억 원에 얻어 1억 원의 초과이윤을 얻는다면 할당 효율적이다.
정보의 현재가치 계산: (정보를 알 때 가치 - 모를 때 기대가치)를 현재가치로 할인한다."""
example = "1년 뒤 개발되면 토지가 11억, 안 되면 5.5억, 확률 각 50%, 할인율 10%. 정보 없는 현재가치 = (11×0.5 + 5.5×0.5)/1.1 = 7.5억, 개발 확정 시 현재가치 = 11/1.1 = 10억 → 정보 가치 2.5억."

[[note]]
id = "C024"
topic = "G05"
term = "주택 하위시장 · 주거 분리 · 여과 과정"
summary = "주택시장은 지역 · 유형 · 가격대별 하위시장으로 나뉘고, 오래된 주택이 아래 소득층으로 넘어가는 여과 과정이 일어난다."
body = """하위시장: 지역(강남 · 강북), 유형(아파트 · 연립 · 단독), 가격대별로 나뉘며 서로 대체가 제한된다.
하향 여과: 고소득층이 쓰던 주택이 낡아 저소득층으로 넘어감. 상향 여과: 저소득층 주택이 재개발 · 리모델링으로 고소득층 주택이 됨(젠트리피케이션).
주거 분리: 소득 계층별로 사는 지역이 나뉘는 현상. 경계 지역에서는 할증 · 할인이 생길 수 있다.
불량주택 문제는 시장 실패라기보다 소득 문제(시장의 결과)로 본다는 설명이 있다."""
data = ["q_complex_rank", "q_deal_list"]
