# ── G10 투자분석과 화폐의 시간가치 ──
[[note]]
id = "C041"
topic = "G10"
term = "화폐의 시간가치 6계수"
summary = "오늘의 1원과 미래의 1원은 가치가 다르다. 이를 계산하는 여섯 가지 계수가 있다."
formula = "일시불 미래가치계수 = (1+r)^n\n일시불 현재가치계수 = 1/(1+r)^n\n연금 미래가치계수 = ((1+r)^n - 1)/r\n연금 현재가치계수 = (1 - (1+r)^-n)/r\n감채기금계수 = r/((1+r)^n - 1)\n저당상수 = r/(1 - (1+r)^-n)"
body = """일시불 미래가치계수: 지금 1원을 n년 굴린 금액(복리).
일시불 현재가치계수: n년 뒤 1원의 지금 가치(할인).
연금 미래가치계수: 매년 1원씩 n년 적립한 금액.
연금 현재가치계수: 매년 1원씩 n년 받는 흐름의 지금 가치.
감채기금계수: n년 뒤 1원을 만들려고 매년 적립할 금액 → 연금 미래가치계수의 역수.
저당상수: 지금 1원을 빌려 n년 동안 매년 갚을 원리금 → 연금 현재가치계수의 역수.
저당상수 = 감채기금계수 + r 관계가 있다. 잔금비율 = 잔여기간 연금현가계수 ÷ 전체기간 연금현가계수."""
example = "1억 원을 연 5%, 20년 원리금균등으로 빌리면 연 상환액 = 1억 × 저당상수(5%, 20년) ≈ 1억 × 0.0802 ≈ 802만 원."
data = ["q_market_series:mortgage_rate"]

[[note]]
id = "C042"
topic = "G10"
term = "순현재가치(NPV)법"
summary = "앞으로 들어올 현금의 현재가치에서 투자금(나갈 현금의 현재가치)을 뺀 값으로, 0 이상이면 투자한다."
formula = "NPV = Σ 현금유입_t/(1+요구수익률)^t - 초기 투자액"
body = """할인율로 투자자의 요구수익률을 쓴다.
NPV ≥ 0 이면 채택. 여러 안 중에선 NPV가 큰 것을 고른다.
가치가산원리가 성립한다(두 사업 NPV의 합 = 합친 사업의 NPV).
재투자율을 요구수익률로 가정해 내부수익률법보다 합리적이라고 본다.
수익성지수(PI) = 유입 현가 ÷ 유출 현가. 1 이상이면 채택(NPV ≥ 0과 같은 판단)."""
example = "1억 투자, 1년 뒤 1억 1,550만 원 회수, 요구수익률 5% → 유입 현가 1.1억, NPV = 1,000만 원(채택)."

[[note]]
id = "C043"
topic = "G10"
term = "내부수익률(IRR)법"
summary = "순현재가치를 0으로 만드는 할인율이 내부수익률이다. 요구수익률보다 크면 투자한다."
body = """IRR = 유입 현가와 유출 현가를 같게 만드는 할인율(수익성지수를 1로 만드는 할인율).
IRR ≥ 요구수익률 이면 채택. 여러 안 중에선 IRR이 큰 것.
재투자율을 IRR로 가정한다. 현금흐름 부호가 여러 번 바뀌면 IRR이 여러 개이거나 없을 수 있다.
NPV법과 IRR법의 결론이 다를 수 있으며, 이때는 NPV법을 따르는 것이 일반적이다."""

[[note]]
id = "C044"
topic = "G10"
term = "기대수익률 · 요구수익률 · 실현수익률"
summary = "기대수익률(예상 수익)이 요구수익률(최소한 바라는 수익)보다 높으면 투자한다. 실현수익률은 투자 후 실제 얻은 수익이다."
body = """기대수익률: 예상 수익률을 확률로 가중평균한 값. 투자 대상이 낼 것으로 예상되는 수익.
요구수익률: 투자자가 위험을 감수하는 대가로 바라는 최소 수익률 = 무위험률 + 위험할증률(+ 예상 인플레이션). 기회비용 개념이다.
기대수익률 > 요구수익률 → 수요 증가 → 가격 상승 → 기대수익률 하락 → 결국 같아지는 쪽으로 간다.
무위험률은 보통 국고채 금리로 본다. 위험할증률은 투자자가 위험을 싫어할수록 크다."""
data = ["q_market_series:ktb3y_rate", "q_market_series:base_rate"]

[[note]]
id = "C045"
topic = "G10"
term = "위험과 수익(평균-분산 지배원리)"
summary = "부동산 투자위험은 수익이 기대에서 벗어날 가능성이고, 보통 분산 · 표준편차로 잰다. 같은 위험이면 수익이 큰 것, 같은 수익이면 위험이 작은 것이 낫다."
body = """위험 종류: 사업위험(시장 · 운영 · 위치), 금융위험(부채 사용으로 커짐), 법적위험(규제 변화), 인플레이션위험, 유동성위험.
평균-분산 지배원리: 기대수익이 같으면 분산이 작은 것, 분산이 같으면 기대수익이 큰 것을 고른다.
변이계수 = 표준편차 ÷ 기대수익률. 수익 한 단위당 위험으로, 작을수록 좋다.
위험 처리: 보수적 예측, 위험조정할인율(위험이 크면 할인율을 높임), 감응도(민감도) 분석, 위험한 투자 제외."""

[[note]]
id = "C046"
topic = "G10"
term = "지렛대(레버리지) 효과"
summary = "빌린 돈으로 투자할 때, 총투자수익률이 대출 금리보다 높으면 자기자본수익률이 커지고(정), 낮으면 작아진다(부)."
formula = "자기자본수익률 = (순영업소득 + 가치 상승분 - 이자) ÷ 자기자본"
body = """정의 레버리지: 총자본수익률 > 저당 금리 → 부채 비율을 높일수록 자기자본수익률 상승.
부의 레버리지: 총자본수익률 < 저당 금리 → 부채가 많을수록 손실 확대.
중립적 레버리지: 두 값이 같으면 부채 비율이 수익률에 영향 없음.
부채를 쓰면 기대수익과 함께 금융위험(분산)도 커진다.
금리가 오르면 같은 부동산이라도 레버리지 효과가 약해지거나 부(-)로 바뀔 수 있다."""
example = "5억 아파트를 자기자본 2억 + 대출 3억(금리 4%)으로 사서 1년 뒤 5.5억이 되면(임대수입 없음): 이자 1,200만 원, 자기자본수익률 = (5,000 - 1,200)/20,000 = 19%. 대출이 없었다면 10%."
data = ["q_market_series:mortgage_rate"]

[[note]]
id = "C047"
topic = "G10"
term = "영업현금흐름 계산"
summary = "임대 부동산의 현금흐름은 가능총소득에서 공실 · 경비 · 원리금 · 세금을 차례로 빼서 구한다."
formula = "가능총소득 - 공실 및 불량부채 + 기타소득 = 유효총소득\n유효총소득 - 영업경비 = 순영업소득\n순영업소득 - 부채서비스액(원리금) = 세전현금흐름\n세전현금흐름 - 영업소득세 = 세후현금흐름"
body = """영업경비에 들어가지 않는 것: 공실손실, 부채서비스액(원리금), 소득세, 감가상각비, 자본적 지출.
영업소득세 = (순영업소득 + 대체충당금 - 이자 - 감가상각비) × 세율.
처분 시: 매도가격 - 매도경비 = 순매도액, 순매도액 - 미상환저당잔금 = 세전지분복귀액, 여기서 자본이득세를 빼면 세후지분복귀액."""

[[note]]
id = "C048"
topic = "G10"
term = "어림셈법 · 비율분석"
summary = "자본환원율, 부채감당률, 대부비율 같은 간단한 비율로 투자 · 대출의 적정성을 빠르게 판단한다."
formula = "종합자본환원율 = 순영업소득 ÷ 부동산 가격\n부채감당률(DSCR) = 순영업소득 ÷ 부채서비스액\n대부비율(LTV) = 대출액 ÷ 부동산 가치\n부채비율 = 부채 ÷ 자기자본\n채무불이행률 = (영업경비 + 부채서비스액) ÷ 유효총소득\n총소득승수 = 가격 ÷ 총소득"
body = """승수법: 총소득승수 · 순소득승수 · 세전현금흐름승수(= 지분투자액 ÷ 세전현금흐름). 작을수록 회수가 빠르다.
수익률법: 종합자본환원율, 지분배당률(= 세전현금흐름 ÷ 지분투자액), 세후수익률.
부채감당률이 1보다 작으면 순영업소득으로 원리금을 다 못 갚는다. 대출기관은 보통 1.2 이상을 본다.
대부비율이 50%이면 부채비율은 100%다(대부비율 = 부채비율 ÷ (1 + 부채비율)).
비율분석은 간단하지만 시간가치를 무시하고, 구성요소 정의에 따라 값이 달라지는 한계가 있다."""

# ── G11 포트폴리오 이론 ──
[[note]]
id = "C049"
topic = "G11"
term = "포트폴리오 분산투자와 체계적 · 비체계적 위험"
summary = "여러 자산에 나눠 투자하면 개별 자산 고유의 위험(비체계적)은 줄일 수 있지만, 시장 전체 위험(체계적)은 줄일 수 없다."
body = """비체계적 위험(분산 가능): 특정 부동산 · 지역 고유의 위험. 자산 수를 늘리면 줄어든다.
체계적 위험(분산 불가): 경기 · 금리 · 인플레이션처럼 모든 자산에 영향을 주는 위험.
상관계수가 낮을수록 분산 효과가 크다. 상관계수 = -1 이면 위험을 0까지 줄일 수 있고, +1 이면 분산 효과가 없다.
포트폴리오 기대수익률 = 각 자산 기대수익률의 가중평균. 위험(분산)은 가중평균보다 작아질 수 있다(상관계수 < 1일 때)."""

[[note]]
id = "C050"
topic = "G11"
term = "효율적 프론티어와 최적 포트폴리오"
summary = "같은 위험에서 수익이 가장 높은 포트폴리오들을 이은 선이 효율적 프론티어이고, 투자자 무차별곡선과 만나는 점이 최적 포트폴리오다."
body = """효율적 프론티어(효율적 전선): 평균-분산 지배원리를 만족하는 포트폴리오 집합. 우상향한다(수익을 높이려면 위험도 감수).
투자자의 무차별곡선: 위험 회피 정도를 나타낸다. 위험을 싫어할수록 기울기가 가파르다.
최적 포트폴리오: 효율적 프론티어와 무차별곡선이 접하는 점. 공격적 투자자는 고위험 · 고수익 쪽, 보수적 투자자는 저위험 쪽."""

# ── G12 부동산금융 ──
[[note]]
id = "C051"
topic = "G12"
term = "대출 규제(LTV · DTI · DSR)"
summary = "LTV는 담보가치 대비, DTI · DSR은 소득 대비 대출 한도를 정하는 지표다."
formula = "LTV = 대출액 ÷ 담보 부동산 가치\nDTI = (주택담보대출 원리금 + 기타 대출 이자) ÷ 연소득\nDSR = 모든 대출 원리금 ÷ 연소득"
body = """LTV는 담보 쪽, DTI · DSR은 상환 능력 쪽 규제다. 실제 대출 한도는 둘 중 작은 금액이다.
DSR은 신용대출 등 모든 대출의 원리금을 넣어 DTI보다 엄격하다. 스트레스 DSR은 금리 상승 가능성을 더해 계산한다.
규제 지역 · 주택 수 · 생애최초 여부에 따라 비율이 달라지고 자주 바뀐다(최신 금융위원회 발표 확인)."""
example = "집값 5억, LTV 70%면 최대 3.5억. 연소득 6천만 원, DSR 40%면 연 원리금 2,400만 원까지 → 30년 · 4% 원리금균등이면 약 4.15억 → 한도는 둘 중 작은 3.5억."
data = ["q_market_series:mortgage_rate"]

[[note]]
id = "C052"
topic = "G12"
term = "상환 방식(원금균등 · 원리금균등 · 체증식)"
summary = "원금균등은 매달 같은 원금을, 원리금균등은 매달 같은 원리금을 갚는다. 초기 부담은 원금균등이, 총이자는 원리금균등이 크다."
body = """원금균등상환: 원금은 매기 같고 이자는 잔금에 비례해 줄어든다 → 원리금이 점점 줄어든다. 초기 부담이 크고 총이자는 가장 적다.
원리금균등상환: 매기 같은 금액(= 대출액 × 저당상수). 초기엔 이자 비중이, 후기엔 원금 비중이 크다.
체증식(점증식)상환: 초기엔 적게, 소득이 늘면 많이 갚는다. 장래 소득이 늘 젊은 층에 맞고, 초기에 원금보다 이자가 커서 잔금이 늘 수 있다(부의 상환).
대출 중도에 갚을 원금 잔액 순서: 체증식 > 원리금균등 > 원금균등."""

[[note]]
id = "C053"
topic = "G12"
term = "고정금리 · 변동금리와 금리 위험"
summary = "고정금리는 금리 상승 위험을 대출기관이, 변동금리는 차입자가 진다."
body = """고정금리: 시장 금리가 오르면 대출기관 손해(차입자 유리), 내리면 차입자가 조기상환할 유인(조기상환 위험은 대출기관).
변동금리: 기준금리(COFIX 등) + 가산금리. 금리 위험이 차입자에게 넘어가 처음 금리는 보통 고정금리보다 낮다. 조정 주기가 짧을수록 대출기관의 금리 위험이 작다.
예상치 못한 인플레이션은 고정금리 대출기관에 불리하다.
한필지는 한국은행 기준금리와 주택담보대출 금리 추이를 보여 준다."""
data = ["q_market_series:base_rate", "q_market_series:mortgage_rate"]

[[note]]
id = "C054"
topic = "G12"
term = "지분금융 · 부채금융 · 메자닌금융"
summary = "지분금융은 투자자 지분을 팔아, 부채금융은 빌려서, 메자닌금융은 둘의 중간 성격으로 자금을 마련한다."
body = """지분금융: 부동산 신디케이트, 조인트벤처, 리츠(REITs), 공모 주식 발행. 상환 의무가 없지만 지분(이익)을 나눈다.
부채금융: 저당대출, 프로젝트 파이낸싱(PF), 주택상환사채, 자산담보부증권(MBS · ABS), 회사채.
메자닌금융: 후순위 대출, 전환사채(CB), 신주인수권부사채(BW), 상환우선주 등. 원리금 우선순위가 선순위 대출보다 뒤라 금리가 높다."""

# ── G13 저당 유동화와 리츠 ──
[[note]]
id = "C055"
topic = "G13"
term = "주택저당증권(MBS) 종류(MPTS · MBB · MPTB · CMO)"
summary = "주택담보대출 채권을 묶어 증권으로 팔아 자금을 다시 마련하는 것이 저당 유동화이고, 위험을 누가 지느냐에 따라 네 가지가 있다."
body = """MPTS(이체증권): 지분형. 원리금 수취권과 채무불이행 · 조기상환 · 금리 위험이 모두 투자자에게 넘어간다. 발행자의 부채가 아니다.
MBB(저당담보부채권): 채권형. 소유권 · 원리금 수취권 · 위험이 모두 발행자에게 남는다. 초과담보를 둔다.
MPTB(지불이체채권): 혼합형. 원리금 수취권과 조기상환 위험은 투자자, 소유권과 채무불이행 위험은 발행자.
CMO(다계층증권): 혼합형. 만기 · 이자율이 다른 여러 트랜치로 나눠 투자자가 원하는 위험 · 기간을 고르게 한다.
우리나라는 한국주택금융공사가 MBS를 발행한다(보금자리론 재원)."""

[[note]]
id = "C056"
topic = "G13"
term = "부동산투자회사(리츠)"
summary = "여러 투자자의 돈을 모아 부동산에 투자하고 수익을 배당하는 회사로, 자기관리 · 위탁관리 · 기업구조조정 리츠가 있다."
body = """자기관리리츠: 실체 회사(상근 임직원). 자산운용 전문인력을 둔다. 설립 자본금 5억 원, 최저자본금 70억 원.
위탁관리리츠: 명목회사(서류상 회사). 자산 운용을 자산관리회사(AMC)에 맡긴다. 설립 자본금 3억 원, 최저자본금 50억 원.
기업구조조정리츠: 기업 구조조정용 부동산에 투자하는 명목회사.
공통 규제: 총자산의 70% 이상을 부동산으로(80% 이상은 부동산 · 관련 증권 · 현금), 위탁관리 · 기업구조조정 리츠는 배당가능이익의 90% 이상 배당 의무.
소액 투자자도 부동산에 간접 투자할 수 있고 상장되면 유동성이 생긴다."""
laws = ["부동산투자회사법 제2조", "부동산투자회사법 제6조", "부동산투자회사법 제10조", "부동산투자회사법 제25조", "부동산투자회사법 제28조"]

[[note]]
id = "C057"
topic = "G13"
term = "프로젝트 파이낸싱(PF)"
summary = "사업주의 신용 대신 그 개발사업의 미래 현금흐름을 담보로 돈을 빌리는 방식이다."
body = """특징: 비소구(또는 제한소구) 금융 — 사업이 실패해도 사업주에게 상환을 요구하지 못하거나 제한적으로만 요구한다. 사업주의 재무상태표에 부채로 잡히지 않는 부외금융 효과.
위험을 여러 이해관계자(시행사 · 시공사 · 금융기관)가 나눠 지며, 구조가 복잡해 비용이 크다.
금융기관은 시공사 책임준공 · 지급보증, 에스크로 계좌, 분양수입 우선 상환 등으로 위험을 줄인다.
PF 부실은 금리 상승기 · 분양 부진기에 건설사 · 금융권으로 번질 수 있다."""
