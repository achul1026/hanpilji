효과: 분양가 안정, 무주택 수요자 부담 감소. 부작용: 주변 시세와 차이로 청약 과열, 공급 감소, 품질 저하 우려. 그래서 전매 제한 · 실거주 의무를 함께 둔다.
선분양: 짓기 전에 팔아 계약금 · 중도금으로 공사비를 조달(공급자 유리, 수분양자 위험).
후분양: 일정 공정 이후 분양(소비자가 보고 고름, 공급자 자금 부담)."""
laws = ["주택법 제57조"]

# ── G09 조세정책 ──
[[note]]
id = "C038"
topic = "G09"
term = "조세의 전가와 귀착"
summary = "부동산에 세금을 매기면 실제 부담은 수요자와 공급자 중 가격탄력성이 더 작은(덜 피할 수 있는) 쪽이 더 많이 진다."
body = """세금이 부과되면 가격이 올라 수요자에게 일부가 넘어가고(전가), 나머지는 공급자가 진다. 최종 부담이 누구에게 가는지가 귀착이다.
수요가 비탄력적이면 수요자가, 공급이 비탄력적이면 공급자가 더 많이 부담한다.
공급이 완전비탄력(토지)이면 세금 전부를 공급자(토지 소유자)가 진다 → 토지세는 전가되지 않는다(헨리 조지 토지단일세 논리).
임대주택에 재산세를 올리면 공급이 탄력적인 장기에는 임차인에게 많이 전가될 수 있다.
세금으로 거래가 줄어 생기는 손실을 초과부담(사중손실)이라 한다."""

[[note]]
id = "C039"
topic = "G09"
term = "부동산 세금의 분류(취득 · 보유 · 처분 단계)"
summary = "부동산 세금은 언제 내는지로 취득세(취득), 재산세 · 종부세(보유), 양도소득세(처분)로 나뉜다."
body = """취득 단계: 취득세(지방세), 등록면허세, 인지세(국세), 상속세 · 증여세(국세).
보유 단계: 재산세(지방세, 6월 1일 기준), 종합부동산세(국세, 6월 1일 기준 공시가격 합계가 공제액 초과분), 임대소득에 대한 종합소득세.
처분 단계: 양도소득세(국세), 지방소득세.
국세 · 지방세, 직접세 · 간접세, 보통세 · 목적세 구분도 함께 시험에 나온다.
세율 · 공제액은 해마다 바뀌므로 답할 때는 현행 법령 조문을 확인한다."""
laws = ["지방세법 제7조", "지방세법 제104조", "종합부동산세법 제7조", "소득세법 제94조"]

[[note]]
id = "C040"
topic = "G09"
term = "보유세 · 거래세와 동결효과"
summary = "보유세를 올리면 공급을 늘리는 쪽으로, 양도세 같은 거래세를 올리면 매물이 잠기는(동결) 쪽으로 작용하기 쉽다."
body = """양도소득세 동결효과(lock-in effect): 양도세가 높으면 팔 때 세금이 커서 매도를 미뤄 공급이 줄고 가격이 오를 수 있다. 세율 인하나 일시적 중과 유예로 매물을 끌어낸다.
보유세 강화: 보유 비용이 커져 다주택자 매도 유인이 생긴다. 다만 임대인이 임대료로 전가할 수도 있다.
취득세 인상은 거래를 줄이고, 감면은 거래를 늘린다(생애최초 감면 등).
한필지에서는 정책 발표 전후 실거래 변화를 비교해 볼 수 있다."""
data = ["q_policy_impact", "q_policy_events"]
