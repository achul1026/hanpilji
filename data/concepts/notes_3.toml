# ── G06 입지 · 도시공간구조 이론 ──
[[note]]
id = "C025"
topic = "G06"
term = "지대이론(리카도 · 튀넨 · 알론소 · 마르크스)"
summary = "땅값(지대)이 왜 생기는지를 비옥도 · 위치 · 접근성 등으로 설명하는 이론들이다."
body = """리카도 차액지대설: 비옥도 차이와 수확체감 때문에 지대가 생긴다. 한계지(가장 나쁜 땅)에는 지대가 없다.
마르크스 절대지대설: 토지 소유 자체(사유화) 때문에 한계지에도 지대가 생긴다.
튀넨 위치지대설(고립국): 도심(시장)까지의 수송비 차이가 지대를 만든다. 작물별 입찰지대곡선에 따라 동심원 농업 배치가 생긴다.
알론소 입찰지대: 튀넨을 도시에 적용. 도심에서 멀어질수록 지대가 떨어지고, 가장 높은 지대를 낼 수 있는 용도가 그 자리를 차지한다.
마샬 준지대: 토지 외 고정 생산요소(기계 등)에서 단기에 생기는 일시적 소득.
파레토 경제지대: 공급이 비탄력적인 생산요소가 기회비용(전용수입)을 넘어 받는 초과 대가."""

[[note]]
id = "C026"
topic = "G06"
term = "도시공간구조 이론(동심원 · 선형 · 다핵심)"
summary = "도시 안에서 용도 지역이 어떤 모양으로 배치되는지를 설명하는 대표 이론 세 가지다."
body = """버제스 동심원 이론: 도심에서 바깥으로 중심업무지구 → 점이지대 → 저소득층 주거 → 중산층 주거 → 통근자 지대 순의 동심원. 생태학적 침입 · 경쟁 · 천이 개념을 썼다.
호이트 선형 이론: 주요 교통로를 따라 부채꼴로 지역이 뻗는다. 고소득층 주거지는 교통축을 따라 바깥으로 이동한다.
해리스 · 울만 다핵심 이론: 도시가 커지면 여러 개의 핵(중심)이 생긴다. 같은 용도끼리 모이는 집적이익, 서로 맞지 않는 용도의 분리가 이유다.
베리의 유상도시이론 등 현대 도시는 교통 발달로 다핵화 · 교외화가 진행된다."""

[[note]]
id = "C027"
topic = "G06"
term = "중심지 이론(크리스탈러)"
summary = "재화를 공급하는 중심지들이 최소요구치와 재화의 도달범위에 따라 육각형 시장권으로 배치된다는 이론이다."
body = """최소요구치: 중심지 기능이 유지되는 데 필요한 최소한의 수요(인구 · 소득).
최소요구범위: 최소요구치를 확보할 수 있는 거리 범위.
재화의 도달범위: 소비자가 그 재화를 사러 기꺼이 이동하는 최대 거리.
중심지가 성립하려면 재화의 도달범위 ≥ 최소요구범위.
고차 중심지는 수가 적고 멀리 떨어져 있으며 다양한 기능을, 저차 중심지는 많고 가깝게 있다.
뢰쉬는 수요 측면(이윤 극대화)에서 시장 크기를 설명했다."""

[[note]]
id = "C028"
topic = "G06"
term = "상권 이론(레일리 소매중력 · 컨버스 분기점 · 허프 확률)"
summary = "소비자가 어느 상가로 가는지를 크기(인구 · 매장 면적)와 거리로 예측하는 모형들이다."
formula = "레일리: 두 도시 A, B가 중간 지점 C에서 끌어들이는 비율 = (A 인구 / B 인구) × (B까지 거리 / A까지 거리)²\n컨버스 분기점: A로부터 분기점까지 거리 = 두 도시 사이 거리 ÷ (1 + √(B 인구 / A 인구))\n허프: 점포 j를 고를 확률 = (면적j / 거리j^λ) ÷ Σ(면적k / 거리k^λ)"
body = """레일리 소매중력 법칙: 두 도시가 중간 지역에서 끌어들이는 상권 크기는 인구에 비례하고 거리의 제곱에 반비례한다.
컨버스 분기점 모형: 두 도시의 상권 경계(분기점)를 구한다. 큰 도시 쪽 상권이 더 넓다.
허프 확률 모형: 소비자 쪽에서 각 점포를 고를 확률을 구한다. 공간(거리) 마찰계수 λ는 교통이 불편하거나 일상용품일수록 크다. 점포 면적 대신 매력도를 쓰기도 한다.
넬슨 소매입지 이론은 같은 업종 · 보완 업종이 모일 때 매출이 늘어나는 누적흡인력 등 8원칙을 제시했다."""
example = "점포 A 면적 750㎡ · 거리 5km, 점포 B 2,500㎡ · 10km, λ=2 이면 A 30, B 25 → A를 고를 확률 30/55 ≈ 54.5%."

[[note]]
id = "C029"
topic = "G06"
term = "공업입지 이론(베버 최소비용 · 뢰쉬 최대수요)"
summary = "공장은 수송비 · 노동비 · 집적이익을 합한 비용이 가장 낮은 곳(베버) 또는 수요가 가장 큰 곳(뢰쉬)에 선다."
body = """베버 최소비용 이론: 먼저 수송비가 최소인 곳을 찾고(입지삼각형), 노동비 절약 · 집적이익이 수송비 증가보다 크면 그쪽으로 옮긴다(등비용선).
원료지수 = 국지원료 무게 ÷ 제품 무게. 1보다 크면 원료지향, 작으면 시장지향 입지.
중량감소산업(시멘트 등)은 원료지향, 중량증가산업(음료 등) · 부패성 제품은 시장지향.
뢰쉬 최대수요 이론: 수요를 가장 많이 확보할 수 있는 곳이 최적 입지다."""

# ── G07 토지정책 ──
[[note]]
id = "C030"
topic = "G07"
term = "시장실패와 정부개입"
summary = "외부효과, 공공재, 독점, 정보 비대칭이 있으면 시장이 자원을 제대로 나누지 못해 정부가 개입한다."
body = """시장실패 원인: 불완전경쟁(독점), 외부효과, 공공재(비경합 · 비배제로 무임승차), 정보 비대칭.
정의 외부효과(긍정): 공원 · 역 개통처럼 남에게 이익을 줌 → 사회적 최적보다 적게 생산 → 보조금 · 규제 완화.
부의 외부효과(부정): 소음 · 공해 · 혐오시설 → 사회적 최적보다 많이 생산 → 규제 · 세금(피구세). 님비(NIMBY)와 연결.
정부개입 방식: 직접 개입(공공 택지 개발, 공공임대주택, 토지비축, 수용), 간접 개입(세금 · 보조금 · 금융), 이용 규제(용도지역지구제, 건축 규제).
정부실패: 정부 개입이 오히려 비효율을 키우는 경우."""
data = ["q_policy_events", "q_policy_impact"]

[[note]]
id = "C031"
topic = "G07"
term = "용도지역 · 지구제"
summary = "토지를 용도별로 나눠 건축 가능한 건물 · 건폐율 · 용적률을 정하는 대표적인 토지이용 규제다."
body = """용도지역은 도시지역(주거 · 상업 · 공업 · 녹지), 관리지역, 농림지역, 자연환경보전지역으로 나뉘고 서로 겹쳐 지정되지 않는다.
용도지구(경관 · 고도 · 방화 등)와 용도구역(개발제한구역 등)은 용도지역의 제한을 강화 · 완화하는 덧입히는 규제다.
목적: 부의 외부효과 줄이기, 토지 이용 질서 유지. 부작용: 지역 간 지가 차이(규제 지역 지가 하락, 개발 가능 지역 상승), 공급 제약.
한필지 「용도지역 행위제한」 데이터는 용도지역별로 어떤 건물을 지을 수 있는지(가능 · 조건부 · 불가)를 보여 준다."""
data = ["q_zoning_check"]
laws = ["국토의 계획 및 이용에 관한 법률 제36조", "국토의 계획 및 이용에 관한 법률 제76조"]

[[note]]
id = "C032"
topic = "G07"
term = "토지거래허가구역"
summary = "투기가 우려되는 지역에서 일정 면적을 넘는 토지 거래를 할 때 미리 시 · 군 · 구청장의 허가를 받게 하는 제도다."
body = """국토교통부장관 또는 시 · 도지사가 5년 이내로 지정한다. 허가 없이 맺은 계약은 효력이 없다(유동적 무효).
허가받은 목적대로 일정 기간 이용할 의무가 있고, 어기면 이행강제금이 부과된다.
서울은 2025년 이후 강남 · 서초 · 송파 · 용산 등 아파트 허가구역이 넓게 지정되어 실거주 목적 매수만 허용되는 경우가 많다(구역 · 기간은 수시로 바뀌므로 지정 공고를 확인).
한필지는 지정된 허가구역 목록을 따로 관리한다."""
data = ["q_policy_events"]
laws = ["부동산 거래신고 등에 관한 법률 제10조", "부동산 거래신고 등에 관한 법률 제11조"]

[[note]]
id = "C033"
topic = "G07"
term = "개발이익 환수 · 개발권양도제"
summary = "개발로 생긴 땅값 상승분의 일부를 공공이 거두거나(개발부담금 · 재건축부담금), 개발권을 사고팔게 해 규제 손실을 보전하는 제도다."
body = """개발부담금: 택지개발 · 산업단지 등 개발사업으로 생긴 개발이익의 일부(원칙 20~25%)를 거둔다(개발이익 환수에 관한 법률).
재건축초과이익 환수: 재건축으로 생긴 초과이익에 부담금을 매긴다.
개발권양도제(TDR): 보전이 필요한 지역의 개발권을 떼어 개발 가능 지역에 팔 수 있게 해 규제 손실을 보상한다(우리나라는 본격 시행하지 않음).
토지비축제도: 공공이 미리 토지를 사 두었다가 공공 목적에 공급한다(토지은행)."""

# ── G08 주택정책 ──
[[note]]
id = "C034"
topic = "G08"
term = "임대료 규제(상한제)"
summary = "시장 임대료보다 낮게 상한을 정하면 단기에는 임차인이 이익을 보지만, 장기에는 임대주택 공급이 줄고 질이 떨어질 수 있다."
body = """규제 임대료가 시장 균형 임대료보다 낮을 때만 효과가 있다(높으면 아무 영향 없음).
초과수요가 생겨 임대주택 부족, 이동 감소(기존 임차인 고착), 유지 · 보수 소홀, 암시장 · 이면계약이 나타날 수 있다.
공급이 탄력적일수록(장기) 공급 감소 효과가 커진다.
우리나라 예: 주택임대차보호법의 계약갱신요구권과 갱신 시 임대료 5% 상한(전월세 상한제), 상가건물 임대차보호법의 증액 상한(5%)."""
data = ["q_market_series:apt_jeonse_idx"]
laws = ["주택임대차보호법 제6조의3", "주택임대차보호법 제7조"]

[[note]]
id = "C035"
topic = "G08"
term = "임대료 보조 · 주거급여"
summary = "임차인에게 돈(또는 바우처)을 주면 임대주택 수요가 늘어 단기에는 임대료가 오르지만, 장기에는 공급이 늘어 원래 수준에 가까워진다."
body = """수요자 보조(주거급여 · 주택바우처): 수요곡선이 오른쪽으로 이동. 단기(공급 비탄력)에는 임대료 상승분 일부가 임대인에게 돌아간다. 장기에는 공급 증가로 임대료가 다시 내려간다.
공급자 보조(건설 자금 지원 · 세제 혜택): 공급곡선을 오른쪽으로 옮겨 임대료를 낮춘다.
수요자 보조는 선택의 자유가 크고, 공급자 보조는 공급 물량 확보에 직접적이다.
현금 보조와 가격 보조를 비교하면 같은 비용으로 현금 보조가 소비자 효용을 더 높인다는 설명이 일반적이다."""

