# ── G01 부동산의 개념과 분류 ──
[[note]]
id = "C001"
topic = "G01"
term = "부동산의 복합개념"
summary = "부동산은 법률 · 경제 · 기술(물리) 세 측면을 함께 보아야 하는 대상이다."
body = """법률적으로는 토지와 그 정착물(민법 제99조)이고, 소유권 · 지상권 같은 권리의 대상이다.
경제적으로는 자산 · 자본 · 생산요소 · 소비재이며 가격과 수익을 낳는다.
기술(물리)적으로는 공간 · 위치 · 환경 · 자연으로 본다. 위치와 주변 환경이 가치를 크게 좌우한다는 점이 여기서 나온다.
중개 · 감정평가 · 투자 판단은 이 세 측면을 함께 확인하는 일이다(권리관계 · 시세 · 입지)."""
laws = ["민법 제99조"]

[[note]]
id = "C002"
topic = "G01"
term = "협의의 부동산 · 준부동산"
summary = "협의의 부동산은 토지와 정착물, 광의의 부동산은 여기에 등기 · 등록으로 공시되는 준부동산을 더한 것이다."
body = """협의의 부동산: 민법상 토지와 그 정착물.
준부동산(의제부동산): 동산이나 재산의 묶음이지만 등기 · 등록으로 공시해 부동산처럼 다루는 것. 공장재단 · 광업재단, 입목(입목법에 따라 등기한 수목의 집단), 선박(20톤 이상), 자동차 · 건설기계 · 항공기, 어업권 · 광업권 등.
광의의 부동산 = 협의의 부동산 + 준부동산.
공인중개사법상 중개대상물은 토지, 건축물 그 밖의 토지의 정착물, 입목, 공장재단 · 광업재단이다."""
laws = ["민법 제99조", "공인중개사법 제3조", "공인중개사법 시행령 제2조"]

[[note]]
id = "C003"
topic = "G01"
term = "정착물(종속정착물 · 독립정착물)"
summary = "토지에 붙어 있는 물건 중 토지의 일부로 보는 것(종속)과 토지와 별개의 부동산으로 보는 것(독립)이 있다."
body = """독립정착물: 토지와 별개의 부동산으로 거래 · 등기된다. 건물, 입목법에 따라 등기한 입목, 명인방법을 갖춘 수목의 집단, 농작물(정당한 권원으로 경작한 경우) 등.
종속정착물: 토지의 구성부분으로 토지와 함께 거래된다. 돌담 · 교량 · 도로포장 · 축대, 등기하지 않은 일반 수목 등.
정착물이 아닌 것: 가식 중인 수목, 임차인이 설치한 영업용 시설(제거 가능한 것), 판잣집 · 가건물처럼 쉽게 옮길 수 있는 것."""

[[note]]
id = "C004"
topic = "G01"
term = "토지 관련 용어"
summary = "같은 땅도 쓰임 · 법적 단위 · 상태에 따라 부르는 이름이 다르다(필지 · 획지, 택지 · 부지, 나지 · 건부지, 후보지 · 이행지 등)."
body = """필지: 하나의 지번이 붙는 등록 단위(법적 개념). 획지: 가격 수준이 비슷한 일단의 토지(경제적 개념). 한 필지가 여러 획지가 될 수도, 여러 필지가 한 획지가 될 수도 있다.
택지: 건축이 가능한 주거 · 상업 · 공업용 토지. 부지: 건물 · 도로 · 하천 등의 바닥 토지를 넓게 이르는 말.
나지: 건물 등이 없고 사법상 권리(지상권 등)의 제한도 없는 토지(공법상 제한은 있을 수 있음). 건부지: 건물이 서 있는 토지(건부감가가 생길 수 있음).
공지: 건폐율 · 용적률 제한으로 비워 둔 부분. 맹지: 도로에 접하지 않은 토지.
후보지: 용도지역 사이(예: 농지 → 택지)에서 바뀌고 있는 토지. 이행지: 같은 용도지역 안에서 바뀌는 토지(예: 주거지 → 상업지).
법지: 소유권은 있지만 활용 가치가 없는 경사면 등. 빈지(바닷가): 활용 가치는 있으나 소유권이 인정되지 않는 해변 토지."""
data = ["q_property_card", "q_zoning_check"]

# ── G02 부동산의 특성 ──
[[note]]
id = "C005"
topic = "G02"
term = "부동성(지리적 위치의 고정성)"
summary = "토지는 옮길 수 없어 시장이 지역마다 나뉘고, 주변 환경 변화가 그대로 가치에 반영된다."
body = """결과: 부동산시장은 국지적이고 지역마다 가격 수준이 다르다(지역분석이 필요한 이유). 외부효과(좋은 학교 · 역세권, 혐오시설)가 가치에 직접 영향을 준다. 부동산 활동이 임장 활동 · 정보 활동이 된다.
공시제도(등기)가 필요한 이유도 점유로 공시할 수 없기 때문이다. 지방세(재산세)를 부동산 소재지에서 걷는 근거이기도 하다.
한필지에서는 같은 동 · 같은 단지 안의 실거래와 주변 시설을 함께 보는 이유가 이것이다."""
data = ["q_deal_list", "q_nearby"]

[[note]]
id = "C006"
topic = "G02"
term = "부증성(비생산성)"
summary = "토지는 새로 만들 수 없어 물리적 공급이 고정된다. 다만 용도를 바꾸는 경제적 공급은 늘릴 수 있다."
body = """토지의 물리적 공급곡선은 수직(완전비탄력)이다. 그래서 수요가 늘면 가격이 오르기 쉽고 지대 · 지가 문제가 생긴다.
매립 · 간척은 새 토지를 만드는 것이 아니라 바다 · 하천을 바꾼 것으로 본다.
경제적 공급(용도 전환, 고밀 개발, 개발제한 해제)은 늘릴 수 있어 단기보다 장기의 공급이 더 탄력적이다.
토지 공개념 · 토지정책(개발이익 환수, 토지거래허가)의 근거가 된다."""

[[note]]
id = "C007"
topic = "G02"
term = "영속성(내구성)"
summary = "토지는 써도 닳아 없어지지 않는다. 그래서 감가상각이 없고, 소유와 이용을 나눌 수 있다."
body = """토지에는 물리적 감가상각을 적용하지 않는다(건물은 감가 대상). 다만 경제적 · 기능적 가치는 바뀔 수 있다.
오래 쓰이므로 가치를 장래 수익의 현재가치로 보는 수익환원법의 근거가 된다.
소유권과 이용권(임대차 · 지상권)을 나눌 수 있고, 장기 투자 · 재고(저량) 시장의 성격을 띤다."""

[[note]]
id = "C008"
topic = "G02"
term = "개별성(비동질성 · 비대체성)"
summary = "위치 · 모양 · 지형이 같은 토지는 없어 완전한 대체가 불가능하다. 그래서 일물일가가 성립하지 않는다."
body = """물리적으로 같은 토지가 없으므로 표준화 · 규격화가 어렵고, 가격이 개별적으로 정해진다.
감정평가에서 사례를 그대로 쓰지 못하고 개별요인 비교(보정)를 하는 이유다.
다만 용도가 비슷한 토지끼리는 경제적으로 어느 정도 대체가 된다(대체의 원칙)."""
data = ["q_complex_price", "q_price_vs_official"]

[[note]]
id = "C009"
topic = "G02"
term = "인문적 특성(용도의 다양성 · 병합분할 가능성 · 위치의 가변성)"
summary = "토지는 여러 용도로 쓰일 수 있고, 합치거나 나눌 수 있으며, 주변 여건이 바뀌면 상대적 위치가 달라진다."
body = """용도의 다양성: 같은 땅을 주거 · 상업 · 공업 등으로 쓸 수 있어 최유효이용 판단이 필요하다. 후보지 · 이행지가 생기는 이유다.
병합 · 분할 가능성: 합치거나 나누면 가치가 달라질 수 있다(플로티지 · 분할 감가).
위치의 가변성(사회적 · 경제적 · 행정적 위치): 지하철 개통, 용도지역 변경, 인구 이동처럼 땅은 그대로여도 위치의 의미가 바뀐다."""
data = ["q_nearby", "q_zoning_check"]
