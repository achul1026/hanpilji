# 부동산 지식 DB 6단계: 부동산학개론 개념 노트(우리 말로 직접 씀, 학원 교재 문장 옮기지 않음)
# 칸: id · topic(시험 단원, sql/24_kb_topics.sql) · term · summary(한두 문장) · body(풀이) · formula · example
